openapi: 3.1.0
info:
  title: NightOwl GPT API
  version: 1.0.0
  description: An API for generating responses based on a user prompt using NightOwl GPT.
servers:
  - url: https://nightowl-gpt.fly.dev
    description: Production server

paths:
  /prompt:
    post:
      operationId: generatePromptResponse
      summary: Generate a response based on a user prompt
      description: Sends a prompt to the NightOwl GPT model and returns a generated response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
              properties:
                prompt:
                  type: string
                  description: The user's prompt to be processed by the model.
      responses:
        '200':
          description: A successful response containing the generated text.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: The model's generated response based on the prompt.
