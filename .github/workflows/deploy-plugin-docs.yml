name: Deploy Plugin Docs
on:
  push:
    paths: ['docs/**']
  branches: [ main ]
jiobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: cp -r docs/ public
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public