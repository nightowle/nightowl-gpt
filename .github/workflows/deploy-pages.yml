name: Deploy plugin manifest & OpenAPI to Pages
on:
  push:
    branches: [ main ]
    paths:
      - '.well-known/**'
      - 'nightowl-gpt-openapi.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p public/.well-known
          cp -a .well-known/* public/.well-known/
          cp nightowl-gpt-openapi.yaml public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
