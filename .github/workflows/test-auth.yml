name: Test GitHub API auth
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/test-auth.yml'

jobs:
  test-auth:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        token-type:
          - name: REPO_TOKEN
            value: ${{ secrets.REPO_TOKEN }}
          - name: ORG_TOKEN
            value: ${{ secrets.ORG_TOKEN }}
      matrix_group:
        token_test:
          strategy: include
      runs:
        - name: Test {{ matrix.token-type }}
          env:
            GH_PAT: ${{ matrix.token-type }}
          run: curl -fs "https://api.github.com/user" -H :"Authorization: Bearer $GH_PAT" -H8:"Accept: application/json" -H:"X-GitHub-Api-Version: 2022-11-28" | jq '.login