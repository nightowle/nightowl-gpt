name: MCP Server CI

on:
  push:
    paths:
      - 'mcp_server/**'
      - '.github/workflows/mcp-server-ci.yml'
  pull_request:
    paths:
      - 'mcp_server/**'
      - '.github/workflows/mcp-server-ci.yml'

jobs:
  verify-mcp-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.BLUE_QR_AUTOMATION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask requests

      - name: Verify MCP server compiles
        run: python -m compileall mcp_server/mcp_server.py

      - name: Ensure Flask app loads
        run: |
          python - <<'PY'
import importlib
module = importlib.import_module("mcp_server.mcp_server")
app = getattr(module, "app", None)
if app is None:
    raise SystemExit("Flask app 'app' not found in mcp_server.mcp_server")
print("Loaded Flask app:", app.import_name)
PY
